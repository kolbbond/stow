# Persistent HUD overlay config
rows=2
cols=4

# Top row: thin HUD strip (10% height)
# Bottom row: main content area (90% height)
row_heights=10,90

# 4 columns for HUD widgets
col_widths=25,25,25,25

single_window=1
grid_lines=1
fit_to_cells=1
monitor=3

# Top row: HUD widgets
cell=hud
cell=date +"%A %B %d, %Y  %H:%M:%S"
cell=curl -s "wttr.in/?format=3"
cell=free -h | head -2

# Bottom row: main content
cell=htop
cell=ping 1.1.1.1
cell=fl
cell=dmesg -w
