# Persistent HUD overlay: a status strip across the top, content below.
#
#   shud test/hud.ini          # run until killed
#   shud test/hud.ini 5        # run for 5 seconds
#
# Format notes:
#   [grid]  once, describes the layout
#   [cell]  one per widget; `at = row,col` places it (omit for fill order)
#   [hud]   a cell showing built-in fields (time, fps, mouse)
#
# Widget types and how their `cmd` is run:
#   number / bar   via popen  -> a shell, so pipes and quotes work
#   command        via exec   -> NO shell, so pipes do NOT work; program + args only
#
# Note: the `mouse` field reads stow::pointer(), which does not track the
# cursor under XWayland - see CLAUDE.md. It is accurate on native X11.

[grid]
rows = 2
cols = 4
row_heights = 12,88
col_widths = 25,25,25,25
single_window = 1
grid_lines = 1
fit_to_cells = 1
monitor = 0
period = 2

# ---- top strip: at-a-glance status ------------------------------------------

[hud]
at = 0,0
fields = time, fps, mouse

[cell]
at = 0,1
widget = number
label = LOAD
cmd = awk '{print $1}' /proc/loadavg

[cell]
at = 0,2
widget = bar
label = MEM %
max = 100
cmd = free | awk '/Mem:/{printf "%d", $3/$2*100}'

[cell]
at = 0,3
widget = number
label = DISK /
cmd = df -h / | awk 'NR==2{print $5}'

# ---- main row: streamed command output ---------------------------------------
# These are `command` widgets: exec'd directly, so no pipes or shell syntax.

[cell]
at = 1,0
widget = command
cmd = ps -eo pcpu,comm --sort=-pcpu

[cell]
at = 1,1
widget = command
cmd = df -h

[cell]
at = 1,2
widget = command
cmd = ip -brief address

[cell]
at = 1,3
widget = command
cmd = uptime
